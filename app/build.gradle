apply plugin: 'com.android.application'

// --- Twilight build identity -------------------------------------------
// This fork ships under its own application ID and name so it installs
// alongside upstream Artemis rather than colliding with it.
def twilightAppName = project.findProperty('twilightAppName') ?: 'Twilight'
def twilightRepo = project.findProperty('twilightRepo') ?: 'OWNER/REPO'
def twilightBaseVersion = project.findProperty('twilightBaseVersion') ?: '20.2.6'

// Builds the Obtainium "add app" link used by the in-app update entry.
// Mirrors the encoding upstream uses: literal scheme, percent-encoded JSON.
def obtainiumUrl = { appId, appName, repo ->
    def settings = groovy.json.JsonOutput.toJson([
            apkFilterRegEx        : 'nonRoot',
            matchGroutToUse       : '$1',
            versionExtractionRegEx: 'v(.+)'
    ])
    def cfg = groovy.json.JsonOutput.toJson([
            id                : appId,
            url               : "https://github.com/${repo}".toString(),
            author            : repo.tokenize('/')[0],
            name              : appName,
            additionalSettings: settings
    ])
    return "https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/" +
            java.net.URLEncoder.encode(cfg, 'UTF-8').replace('+', '%20')
}

// --- Twilight release signing ------------------------------------------
// Keystore comes from env vars (CI) or gradle properties (local, e.g. in
// ~/.gradle/gradle.properties). Using one persistent key means every build
// installs as an update over the last one instead of forcing a reinstall.
// When no keystore is configured, release builds are left unsigned rather
// than failing the build.
// trim(): secrets delivered through CI often pick up a stray trailing
// newline, which would otherwise surface as an opaque "keystore password
// was incorrect" failure.
def twilightSetting = { envName, propName ->
    def v = System.getenv(envName) ?: project.findProperty(propName)
    return v?.toString()?.trim() ?: null
}
def twilightKeystorePath = twilightSetting('TWILIGHT_KEYSTORE', 'twilightKeystore')
def twilightKeystorePassword = twilightSetting('TWILIGHT_KEYSTORE_PASSWORD', 'twilightKeystorePassword')
def twilightKeyAlias = twilightSetting('TWILIGHT_KEY_ALIAS', 'twilightKeyAlias') ?: 'twilight'
def twilightKeyPassword = twilightSetting('TWILIGHT_KEY_PASSWORD', 'twilightKeyPassword') ?: twilightKeystorePassword
def twilightSigningReady = twilightKeystorePath != null && file(twilightKeystorePath).exists()

android {
    ndkVersion "27.0.12077973"

    compileSdk = 36

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 34

        // CI overrides both on every merge to the default branch so each
        // release installs as an update over the last one. Local builds fall
        // back to the upstream numbers.
        versionName project.findProperty('twilightVersionName') ?: twilightBaseVersion
        versionCode = Integer.parseInt((project.findProperty('twilightVersionCode') ?: '57').toString())

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "data:text/html;base64,PGgxPlJvb3QgYnVpbGQgaXMgbm90IGF2YWlsYWJsZTwvaDE+"

            applicationId "com.limelight.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    obtainiumUrl("com.limelight.twilight", twilightAppName, twilightRepo)

            applicationId "com.limelight"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
        }
    }

    signingConfigs {
        release {
            if (twilightSigningReady) {
                storeFile file(twilightKeystorePath)
                storePassword twilightKeystorePassword
                keyAlias twilightKeyAlias
                keyPassword twilightKeyPassword
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".twilightdebug"
            resValue "string", "app_label", "${twilightAppName} Dev"
            resValue "string", "app_label_root", "${twilightAppName} Dev (Root)"
            resValue "string", "app_label_game", "${twilightAppName} Dev (Game)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            applicationIdSuffix ".twilight"
            resValue "string", "app_label", twilightAppName
            resValue "string", "app_label_root", "${twilightAppName} (Root)"
            resValue "string", "app_label_game", "${twilightAppName} (Game)"

            if (twilightSigningReady) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.6.2'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.github.ByteHamster:SearchPreference:v2.5.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.0'
    implementation 'org.opencv:opencv:4.12.0'

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito:mockito-core:5.19.0'
}
